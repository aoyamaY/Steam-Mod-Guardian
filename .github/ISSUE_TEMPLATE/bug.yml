name: Bug report / 问题反馈
description: Report a reproducible application or detection issue
body:
  - type: input
    attributes:
      label: App version / 软件版本
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps and expected result / 复现步骤和预期结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: Redacted logs / 已脱敏的日志
      description: Do not attach malware, API keys, personal paths or account details.

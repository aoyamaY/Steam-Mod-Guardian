name: Windows portable build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify selected .NET SDK
        shell: pwsh
        run: |
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $sdk -notmatch '^8\.0\.') { throw "Expected .NET 8 SDK, got: $sdk" }
          Write-Host "Selected .NET SDK: $sdk"
      - name: Build and test portable package
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Upload portable ZIP and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: SteamModGuardian-win-x64-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  release:
    name: Publish tagged release
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: SteamModGuardian-win-x64-portable
          path: release-assets
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag such as v2.1.0" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          name="SteamModGuardian-${version}-win-x64-portable"
          cd release-assets
          test -f "$name.zip"
          test -f "$name.zip.sha256"
          sha256sum --check "$name.zip.sha256"
          gh release create "$RELEASE_TAG" \
            "$name.zip" "$name.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Steam Mod Guardian $RELEASE_TAG" \
            --generate-notes
